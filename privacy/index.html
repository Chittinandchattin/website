          <header class="page-header reveal">

          <div class="prose reveal">
            <p>Chittin' and Chattin ("we", "us") operates <a href="/">chittinandchattin.com</a>. This page explains how we handle information when you visit our site.</p>

            <h2>Information we collect</h2>
            <p>This website is mostly static. We do not require accounts to browse. If you submit a story through our inbox forms (Spill it, Healing, or Suggest a Sip), you voluntarily provide your message and any contact details you include. Messages are delivered through Web3Forms to our inbox.</p>

            <h2>Third-party services</h2>
            <ul>
              <li><strong>Google AdSense</strong> - may use cookies to serve ads (see Advertising below).</li>
              <li><strong>Cloudflare</strong> - hosts the site; may process IP addresses and request logs.</li>
              <li><strong>Web3Forms</strong> - delivers form submissions.</li>
              <li><strong>Spotify / social platforms</strong> - outbound listen and follow links; those services have their own policies.</li>
            </ul>

            <h2>Advertising</h2>
            <p>We use Google AdSense, which may use cookies to serve ads based on your prior visits to this or other websites.</p>
            <p>Google's use of advertising cookies enables it and its partners to serve ads to users based on their visit to our sites and/or other sites on the Internet.</p>
            <p>You may opt out of personalized advertising via <a href="https://adssettings.google.com" target="_blank" rel="noopener">Google Ads Settings</a> or <a href="https://www.aboutads.info" target="_blank" rel="noopener">www.aboutads.info</a>.</p>

            <h2>Contact</h2>
            <p>Privacy questions: use our <a href="/contact/">Contact Us</a> page or message us on <a href="https://www.instagram.com/chittinnchattin/" target="_blank" rel="noopener">Instagram</a>.</p>
          </div>
        `,
      });
