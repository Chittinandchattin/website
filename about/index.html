<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="About Chittin' and Chattin - Sydney and M, two besties with a podcast about healing, chaos, and Sips of the Week." />
    <title>About</title>
    <link rel="icon" href="/assets/brand/icon.png" type="image/png" />
    <link rel="stylesheet" href="/assets/css/site.css" />
    <link rel="canonical" href="https://chittinandchattin.com/about/" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7048606415692002"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/site.js"></script>
    <script>
      const cfg = window.SITE_CONFIG;
      initPage({
        title: "About",
        description: "About Chittin' and Chattin - Sydney and M, two besties with a podcast.",
        activePath: "/about/",
        content: `
          <header class="page-header reveal">
            <p class="teaser-eyebrow">The friend group</p>
            <h1>About the show</h1>
            <p class="page-lead">${cfg.bio}</p>
          </header>
          <div class="prose reveal">
            <p><strong>Chittin' and Chattin'</strong> is a weekly podcast hosted by best friends Sydney and M. What started as long voice memos and late-night debriefs turned into a show where nothing is off limits - as long as there is a Sip of the Week in hand and room on the couch for the messy parts of adulting.</p>
            <p>Every episode opens with our signature drink segment, then we wander through whatever is living in our brains: jobs, relationships, pop culture rabbit holes, travel stories, healing work, and the small wins that deserve a hype moment. If you have ever felt like you are the only one overthinking something at 11 p.m., this is the friend group for you.</p>
            <p>Listen on <a href="${cfg.links.spotify}" target="_blank" rel="noopener">Spotify</a>, <a href="${cfg.links.apple}" target="_blank" rel="noopener">Apple Podcasts</a>, <a href="${cfg.links.youtube}" target="_blank" rel="noopener">YouTube</a>, and everywhere else we syndicate. Browse <a href="/episodes/">all episodes</a>, explore <a href="/sips/">Sips of the Week</a>, or send us a story through <a href="/spill-it-bestie/">Spill it, bestie</a>.</p>
          </div>
          <h2 class="reveal" style="font-family:var(--font-display);margin:2.5rem 0 0.5rem;">Meet the hosts</h2>
          ${renderHostCards()}
          <div class="prose reveal">
            <h2 style="font-family:var(--font-display);">Follow the show</h2>
            ${renderFollowShowList()}
          </div>
        `,
      });
    </script>
  </body>
</html>
