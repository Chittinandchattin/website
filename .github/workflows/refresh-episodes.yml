name: Refresh episodes from RSS

on:
  schedule:
    - cron: "0 11 * * 1" # Monday ~7am Eastern (EDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/pull-episodes.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/episodes.json
          git diff --staged --quiet && echo "No episode changes" && exit 0
          git commit -m "chore: refresh episodes from RSS"
          git push
